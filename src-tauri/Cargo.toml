[package]
name = "huajian"
version = "0.5.0-beta"
description = "花笺 — 所见即所得 Markdown 笔记（花匣 .hxl 打包）"
authors = ["huajian"]
edition = "2021"

[lib]
name = "huajian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
